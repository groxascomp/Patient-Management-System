version: '3.8'
services:
  springboot-app:
    build: .
    container_name: springboot-app
    ports:
      - "4000:4000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:5000/patient_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8
    container_name: mysql-db
    command: --port=5000
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: patient_db
    ports:
      - "5000:5000"   # host 5000 → container 5000
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
